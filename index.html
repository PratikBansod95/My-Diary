<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1410" />
    <title>My Dairy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="brand-bar" aria-label="My Dairy">
        <h1 class="brand">My Dairy</h1>
        <p class="brand-whisper" id="statusLine">The page listens when the ink settles.</p>
      </header>

      <div class="status-toast" id="statusToast" role="status" aria-live="polite"></div>

      <main class="stage" id="stage">
        <div class="page-shell" id="pageShell">
          <canvas id="tileCanvas" aria-label="Confirmed ink"></canvas>
          <canvas id="inkCanvas" aria-label="Drawing surface"></canvas>
          <div id="overlayLayer" class="overlay-layer"></div>
          <div id="draftLayer" class="draft-layer"></div>
        </div>
      </main>

      <nav class="toolbar" id="toolbar" aria-label="Tools">
        <button type="button" class="tool active" data-tool="pen" title="Pen">Pen</button>
        <button type="button" class="tool" data-tool="eraser" title="Eraser">Erase</button>
        <button type="button" class="tool" data-tool="pan" title="Pan">Pan</button>
        <button type="button" class="action" id="askBtn" title="Ask the diary">Ask</button>
        <label class="delay-control" title="Auto-ask delay">
          <span>Auto</span>
          <input type="range" id="autoDelay" min="0" max="10" step="1" value="2" />
          <em id="autoDelayLabel">2s</em>
        </label>
        <button type="button" class="action" id="gamesBtn" title="Games">Games</button>
        <button type="button" class="action" id="newPageBtn" title="New page">New</button>
        <button type="button" class="action" id="exportBtn" title="Export PNG">Export</button>
      </nav>
    </div>

    <dialog class="sheet-dialog" id="gamesDialog">
      <div class="sheet-panel">
        <h2>Play with the diary</h2>
        <p>You move first. The diary answers on the board.</p>
        <button type="button" class="primary" data-game="tic_tac_toe">Tic-tac-toe</button>
        <button type="button" class="primary" data-game="hangman">Hangman</button>
        <button type="button" class="ghost" id="gamesCloseBtn">Close</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
